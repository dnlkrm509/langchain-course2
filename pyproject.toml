[project]
name = "langchain-course2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel", email = "dk807@live.mdx.ac.uk" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.2",
    "langchain-classic>=1.0.8",
    "langchain-openai>=1.8.5",
    "langchain-pinecone>=0.2.13",
    "langchain-unstructured>=1.0.1",
    "langchainhub>=0.1.21",
    "python-dotenv>=1.2.4",
    "unstructured>=0.27.37",
]

[project.scripts]
langchain-course2 = "langchain_course2:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
